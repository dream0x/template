spring:
  application:
    name: app
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
server:
  port: 8000
  servlet:
    context-path: /api
